name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    shell: bash
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: |
          flutter create --platforms=windows --project-name p2pchat --org com.example _app
          rm -rf _app/lib _app/test && cp -r lib _app/lib && cp pubspec.yaml _app/pubspec.yaml
          cd _app && flutter pub get && flutter build windows --release
      - name: Portable zip and installer
        shell: pwsh
        run: |
          $rel = "$PWD\_app\build\windows\x64\runner\Release"
          Copy-Item C:\Windows\System32\msvcp140.dll, C:\Windows\System32\vcruntime140.dll, C:\Windows\System32\vcruntime140_1.dll -Destination $rel -ErrorAction SilentlyContinue
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSourceDir=$rel" installer.iss
          New-Item -ItemType Directory -Path P2PChat-portable | Out-Null
          Copy-Item "$rel\*" P2PChat-portable -Recurse
          New-Item -ItemType File -Path P2PChat-portable\portable.flag | Out-Null
          Compress-Archive -Path P2PChat-portable -DestinationPath P2PChat-portable.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: Output/P2PChat-Setup.exe }
      - uses: actions/upload-artifact@v4
        with: { name: windows-portable, path: P2PChat-portable.zip }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: |
          flutter create --platforms=android --project-name p2pchat --org com.example _app
          rm -rf _app/lib _app/test && cp -r lib _app/lib && cp pubspec.yaml _app/pubspec.yaml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/><uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><application#' _app/android/app/src/main/AndroidManifest.xml
          grep -q 'permission.INTERNET' _app/android/app/src/main/AndroidManifest.xml
          cd _app && flutter pub get && flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with: { name: p2pchat-android, path: _app/build/app/outputs/flutter-apk/app-release.apk }
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: |
          flutter create --platforms=linux --project-name p2pchat _app
          rm -rf _app/lib _app/test && cp -r lib _app/lib && cp pubspec.yaml _app/pubspec.yaml
          cd _app && flutter pub get && flutter build linux --release
      - uses: actions/upload-artifact@v4
        with: { name: p2pchat-linux, path: _app/build/linux/x64/release/bundle }
